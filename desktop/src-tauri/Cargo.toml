[package]
name = "kovan"
version = "0.1.0"
description = "Kovan masaustu"
authors = ["Napol"]
edition = "2021"

[lib]
name = "kovan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Yalniz RUST tarafindan kullanilir (linkleri sistem tarayicisinda acmak).
# capabilities/default.json'a opener izni EKLENMEZ: uzak sayfa cagiramaz (R8).
tauri-plugin-opener = "2"
